# Agent Skills 目录索引
# 每个 skill 对应 skills/<name>/SKILL.md
# 规范: https://agentskills.io/specification

version: 1
name: agent-skills
description: 跨 Agent 通用的 Skills 仓库

skills:
  - name: hello-world
    path: skills/hello-world
    description: 演示符合 Agent Skills 规范的最小 skill 结构与渐进披露写法。
    tags:
      - example
      - starter
  - name: choice
    path: skills/choice
    description: 在涉及利害关系的决策中先逐个探询再列方案得失与分级坑点，帮助用户看清如何选择。
    tags:
      - decision
      - risk
      - tradeoff
  - name: concept
    path: skills/concept
    description: 按背景起源、解决问题、定义多维解释、各方立场与利弊，帮助用户深入理解任意概念。
    tags:
      - concept
      - understanding
      - explanation
      - stakeholders
  - name: mowen-write
    path: skills/mowen-write
    description: 根据一点感想，按刘墨闻暖文风格生成短随笔或短故事。
    tags:
      - writing
      - style
      - essay
  - name: booklet
    path: skills/booklet
    description: 用刘墨闻风格维护多章节连贯散文小册子；改完自动 commit，问答后回写。
    tags:
      - booklet
      - writing
      - mowen
      - prose
